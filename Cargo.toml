[package]
name = "oxideav-openexr"
version = "0.0.7"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-openexr"
homepage = "https://github.com/OxideAV/oxideav-openexr"
authors = ["Mark Karpeles"]
description = "Pure-Rust OpenEXR (HDR scanline / tiled / multi-part / deep) reader/writer for oxideav — clean-room from the OpenEXR file format spec"
readme = "README.md"
# crates.io 10 MiB package cap: the validation corpus and fuzz harness
# stay in the repository only.
exclude = ["/tests", "/fuzz"]
keywords = ["multimedia", "image", "openexr", "hdr", "pure-rust"]
categories = ["multimedia::encoding", "multimedia::images"]

[dependencies]
# `oxideav-core` is gated behind the default-on `registry` feature so
# image-library consumers can depend on `oxideav-openexr` with
# `default-features = false` and skip the framework dependency tree
# entirely. Without `registry` the crate exposes the image-crate API
# contract (`probe` / `info` / `decode` / `encode` …, `ExrImage` /
# `ExrError`) plus the depth API (`parse_exr` → `ExrPart`, per-channel
# writers, deep readers) and never references `oxideav-core`.
oxideav-core = { version = "0.1", optional = true }

# zlib for ZIP / ZIPS / PXR24 chunks and deep ZIPS blocks. `compcol`
# (Karpelès Lab's compression collection, the workspace-wide choice) with
# only its zlib codec enabled — a black-box dependency used through its
# public streaming `Encoder` / `Decoder` contract.
compcol = { version = "0.6", default-features = false, features = ["zlib"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "codec_benchmarks"
harness = false

[features]
default = ["registry"]

# Wires up the codec / encoder / decoder trait implementations against
# `oxideav-core` so the crate can plug into the `oxideav` framework
# registry. Default-on; turn off for image-library use-cases that just
# want the standalone `decode` / `encode` contract API.
registry = ["dep:oxideav-core"]
